<!doctype html>
<html><head><meta charset="utf-8"><title>SPA State Explorer</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; margin: 0; }
  header { padding: 8px 10px; border-bottom: 1px solid #8884; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 auto 0 0; }
  button { font: inherit; padding: 3px 8px; cursor: pointer; }
  nav { display: flex; gap: 2px; padding: 4px 8px; border-bottom: 1px solid #8882; }
  nav button { background: transparent; border: 1px solid transparent; border-radius: 5px; }
  nav button.active { background: #8882; border-color: #8884; }
  #search { width: 100%; box-sizing: border-box; padding: 4px; margin: 6px 0; }
  .panelbody { padding: 8px 10px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #8881; padding: 8px; border-radius: 4px; max-height: 70vh; overflow: auto; }
  .hit { padding: 2px 0; }
  .k { color: #c0640a; font-weight: 600; }
  code { color: #0a66c0; word-break: break-all; }
  .badge { font-size: 9px; border-radius: 3px; padding: 0 4px; color: #fff; }
  .badge.exp { background: #a00; } .badge.lead { background: #777; }
  .cat { font-size: 10px; color: #a0790a; }
  .muted { color: #888; }
</style></head>
<body>
<header><h1>SPA State Explorer</h1>
  <button id="run">Read state</button><button id="scan">Scan routes</button><button id="copy">Copy MD</button>
</header>
<nav>
  <button data-tab="interesting" class="active">Interesting</button>
  <button data-tab="state">State</button>
  <button data-tab="routes">Routes</button>
  <button data-tab="endpoints">Endpoints</button>
</nav>
<div class="panelbody">
  <input id="search" placeholder="filter…">
  <div id="body"></div>
</div>
<script type="module" src="panel.js"></script>
</body></html>
